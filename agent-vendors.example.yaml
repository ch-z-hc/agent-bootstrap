version: 1

# This file is safe to copy and customize. Never commit real credentials.
providers:
  deepseek:
    displayName: DeepSeek
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: https://api.deepseek.com
    # Claude Code uses Anthropic Messages; other agents use baseURL.
    anthropicBaseURL: https://api.deepseek.com/anthropic
    api: openai-completions
    models:
      deepseek-chat:
        name: DeepSeek Chat
      deepseek-reasoner:
        name: DeepSeek Reasoner

  openai-compatible:
    displayName: OpenAI-compatible provider
    apiKeyEnv: OPENAI_API_KEY
    baseURL: https://example.invalid/v1
    api: openai-completions
    models:
      example-model:
        name: Example Model

agents:
  claude:
    enabled: true
    provider: deepseek
    defaultModel: deepseek-chat
    providers: [deepseek]

  codex:
    enabled: true
    defaultProvider: openai-compatible
    defaultModel: example-model
    defaultModelReasoningEffort: medium
    providers:
      openai-compatible:
        provider: openai-compatible
        baseURL: https://example.invalid/v1
        apiKeyEnv: OPENAI_API_KEY
        wireApi: responses

  pi:
    enabled: true
    provider: deepseek
    defaultModel: deepseek-chat
    defaultThinkingLevel: medium
    providers: [deepseek]

  zcode:
    enabled: false
    defaultProvider: deepseek
    providers: {}

  dsh:
    enabled: false
    defaultProvider: deepseek
    defaultModel: deepseek-chat
    llmPiAiProviders: [deepseek]
    llmDeepseekModels: [deepseek-chat, deepseek-reasoner]
    credentials:
      DEEPSEEK_API_KEY: deepseek.apiKey

  agent:
    enabled: true
    kind: pi-wrapper
