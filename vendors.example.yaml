# vendors.yaml -- agent-bootstrap 的全局唯一真相。
# 如实记录【本机】各 agent 的选择：改这里，跑 .\sync.ps1，原样同步；
# 拷到新电脑再跑一次，新电脑就和这台一模一样。

bai:
  base_url: https://api.b.ai/v1
  # key 二选一：直接写 api_key，或用 api_key_env 指向已设置的环境变量。
  api_key_env: BAI_API_KEY
  # api_key: sk-xxxx

aizex:
  base_url: https://ca.memofun.net/v1
  api_key_env: AIZEX_API_KEY
  # 谁被 codex 选中，谁的 key 就得能解析出来（内联 api_key，或真的设了的环境变量）：
  # sync 会把它写进 ~/.codex/config.toml 的 [model_providers.<provider>.auth]。

# 各 agent 原样记录，互不干扰。
codex:
  provider: aizex
  model: gpt-5.6-sol
  reasoning_effort: low        # 省略则用 xhigh
  # 可选：额外塞进 ~/.codex/models.json 供 codex 选取的模型 ID（model 本身自动包含）。
  # 条目不存在时，sync 会克隆同变种的条目（gpt-6-luna 抄 gpt-5.6-luna）补齐元数据。
  models: [gpt-6-sol, gpt-6-luna]

claude:
  model: qwen3.8-flash
  sonnet: qwen3.8-flash
  opus: qwen3.8-flash

pi:
  provider: bai
  model: qwen3.8-flash

dsh:
  provider: bai
  model: qwen3.8-flash
