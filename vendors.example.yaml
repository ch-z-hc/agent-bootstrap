# vendors.yaml -- agent-bootstrap 的全局唯一真相。
# 如实记录【本机】各 agent 的选择：改这里，跑 .\sync.ps1，原样同步；
# 拷到新电脑再跑一次，新电脑就和这台一模一样。

bai:
  base_url: https://api.b.ai/v1
  # key 二选一：直接写 api_key，或用 api_key_env 指向已设置的环境变量。
  api_key_env: BAI_API_KEY
  # api_key: sk-xxxx

# 各 agent 原样记录，互不干扰。
# 注意：codex 需要 /v1/responses，bai 只提供 chat + anthropic，所以 codex 会被跳过。
codex:
  provider: bai
  model: qwen3.8-flash

claude:
  model: qwen3.8-flash
  sonnet: qwen3.8-flash
  opus: qwen3.8-flash

pi:
  provider: bai
  model: qwen3.8-flash

dsh:
  provider: bai
  model: qwen3.8-flash
