# vendors.yaml -- agent-bootstrap 的全局唯一真相。
# 如实记录【本机】各 agent 的选择：改这里，跑 .\sync.ps1，原样同步；
# 拷到新电脑再跑一次，新电脑就和这台一模一样。

gpt:
  base_url: http://your-proxy:8081
  api_key: sk-xxxx

opencode:
  api_key: sk-xxxx
  # base_url 一般不用改：
  # base_url: https://opencode.ai/zen/go/v1

# 各 agent 原样记录，互不干扰（不要改成同一个，codex 只能用代理上的模型）
codex:
  model: gpt-5.6-sol

claude:
  model: deepseek-v4-flash-vision-exp
  sonnet: deepseek-v4-pro
  opus: glm-5.3-flash

pi:
  provider: opencode-go-responses
  model: muse-spark-1.3-contributor

dsh:
  provider: opencode-go
  model: deepseek-v4-flash-vision-exp
